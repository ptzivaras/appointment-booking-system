version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appointment_booking_system
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/appointment_booking_system
      JWT_SECRET: change_this_secret_in_production
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node src/server.js"

  client:
    build: ./client
    ports:
      - '3000:80'
    depends_on:
      - server

volumes:
  pgdata:
